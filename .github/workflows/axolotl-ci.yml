name: Axolotl desktop CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  pull_request:
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axolotl-desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
          node scripts/axolotl/check-migrations.mjs --release

      - run: node scripts/axolotl/brand-guard.mjs
      - run: node scripts/axolotl/i18n-check.mjs
      - run: cargo fmt --all --check

  desktop:
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: ./.github/actions/replace-gradle-mirror
      - name: Run frontend build and Rust check in parallel
        shell: bash
        run: |
          set -u

          frontend_log="$RUNNER_TEMP/frontend-build.log"
          cargo_log="$RUNNER_TEMP/cargo-check.log"

          pnpm turbo run build --filter=@modrinth/app-frontend > "$frontend_log" 2>&1 &
          frontend_pid=$!

          cargo check --package theseus_gui --features updater > "$cargo_log" 2>&1 &
          cargo_pid=$!

          frontend_status=0
          cargo_status=0

          wait "$frontend_pid" || frontend_status=$?
          if [ "$frontend_status" -ne 0 ]; then
            echo "===== Frontend build (failed) ====="
            cat "$frontend_log"
            echo "Frontend build failed with exit code $frontend_status"
            exit "$frontend_status"
          fi

          wait "$cargo_pid" || cargo_status=$?

          echo "===== Frontend build ====="
          cat "$frontend_log"

          echo "===== Cargo check ====="
          cat "$cargo_log"

          if [ "$cargo_status" -ne 0 ]; then
            echo "Cargo check failed with exit code $cargo_status"
            exit "$cargo_status"
          fi
      - name: Test version metadata writes
        run: cargo test --package theseus writing_version_info_creates_missing_parent_directory
      - name: Build modern Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @modrinth/app tauri build --config tauri-modern.conf.json
      - name: Verify modern Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one modern NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built modern installer: $($installers[0].Name)"
      - name: Build native NSIS Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @modrinth/app tauri build
      - name: Verify native NSIS Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one native NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built native NSIS installer: $($installers[0].Name)"

  website:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @axolotl/website build
