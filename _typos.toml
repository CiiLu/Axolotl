[files]
extend-exclude = [
	"**/src/locales/",
	"patches/",
	"packages/utils/",
	"packages/ui/",
	# Generated mod search index contains project slugs, names, and compressed data.
	"packages/app-lib/src/api/content_search/WikiEntries.txt",
]

[default.extend-words]
# Terms Of Use in `tou-link`
tou = "tou"
# Google Ad Manager
gam = "gam"
# short for "constants"
consts = "consts"
# short for "Copy"
Cpy = "Cpy"
